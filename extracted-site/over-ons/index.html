","includedTitle":"Wat zit er in de prijs?","includedIntro":"De pakketten geven een duidelijk startpunt. De exacte inhoud leggen we altijd vooraf vast in een offerte, zodat je weet wat je krijgt.","starterDetail":"One-page ontwerp op maat, mobiele weergave, contactgegevens of contactknop en basis SEO voor één pagina.","businessDetail":"Tot vijf pagina's, ontwerp op maat, contactformulier, mobiele weergave en basis SEO voor de afgesproken pagina's.","premiumDetail":"Tot acht pagina's, uitgebreider ontwerp, afgesproken extra functionaliteiten en SEO-basis met extra optimalisatie.","commonIncluded":"Bij elk project bespreken we vooraf de structuur, inhoud, feedbackmomenten en oplevering.","notIncluded":"Niet standaard inbegrepen: domeinnaam, hosting, betaalde plug-ins of tools, professionele fotografie, teksten of externe abonnementen. Indien nodig vermelden we deze apart in de offerte.","paymentTitle":"Betaling en afspraken","paymentText":"Je ontvangt eerst een voorstel met de afgesproken inhoud, prijs en timing. Betalingsmomenten en eventuele voorschotten worden vóór de start duidelijk in de offerte vastgelegd. We starten pas nadat je het voorstel hebt goedgekeurd.","changesTitle":"Aanpassingen","changesText":"Feedback en inbegrepen correctierondes spreken we vooraf af. Extra pagina's, nieuwe functies of wijzigingen buiten de afgesproken scope kunnen een meerprijs hebben. We bespreken dat altijd eerst, zodat er geen verrassingen zijn.","deliveryTitle":"Oplevering","deliveryText":"Na jouw finale goedkeuring maken we de website klaar voor publicatie. De timing hangt af van de omvang van het project en hoe snel teksten, foto's en feedback worden aangeleverd. Domein en hosting worden alleen geregeld als dat in de offerte staat.","portfolioDisclaimer":"Belangrijk: de websites in ons portfolio zijn fictieve conceptontwerpen die onze stijl en mogelijkheden illustreren. Het zijn geen gerealiseerde klantprojecten of aanbevelingen van bestaande klanten.","faqEyebrow":"Veelgestelde vragen","faqTitle":"Duidelijkheid voor je start.","faq1q":"Moet ik meteen betalen?","faq1a":"Nee. Je krijgt eerst een voorstel met scope, prijs en timing. Eventuele voorschotten en betaalmomenten worden vooraf schriftelijk afgesproken. Je hoeft niets te bestellen via deze website.","faq2q":"Kan ik na het eerste ontwerp nog wijzigingen vragen?","faq2a":"Ja. We voorzien feedbackmomenten en spreken vooraf af hoeveel correctierondes inbegrepen zijn. Grote wijzigingen of extra functionaliteiten buiten de offerte kunnen bijkomend aangerekend worden, maar worden eerst besproken.","faq3q":"Hoe lang duurt het voor mijn website online staat?","faq3a":"Dat hangt af van het aantal pagina's, de functionaliteiten en hoe snel we de nodige teksten, foto's en feedback ontvangen. We geven een planning in de offerte en stemmen de oplevering samen af.","faq4q":"Zijn domeinnaam en hosting inbegrepen?","faq4a":"Niet standaard. Domeinnaam, hosting, betaalde tools en externe diensten worden apart vermeld als ze nodig zijn. Zo zie je vooraf welke kosten er eventueel bijkomen.","faq5q":"Zijn de portfolio-websites echte klanten?","faq5a":"Nee. De getoonde voorbeelden zijn conceptontwerpen voor verschillende sectoren. Ze dienen om mogelijke stijlen en functies te tonen en zijn geen echte klantreferenties.","faq6q":"Wat heb ik zelf nodig om te starten?","faq6a":"Vertel ons wat je bedrijf doet, wie je klanten zijn en wat de website moet bereiken. Logo, teksten en foto's zijn handig als je ze al hebt. Als iets ontbreekt, bespreken we samen hoe we dat aanpakken.","aboutNavCta":"Bespreek jouw project ↗","aboutEyebrow":"WIE IS FREELANCEFLOW?","aboutTitle":"Persoonlijk webdesign. Heldere afspraken.","aboutIntro":"FreelanceFlow helpt zelfstandigen en kleine bedrijven om hun diensten professioneel online te presenteren. We richten ons op duidelijke websites die vertrouwen opbouwen en bezoekers naar een volgende stap leiden.","aboutMissionTitle":"Onze aanpak","aboutMissionText":"Geen ingewikkeld jargon of onduidelijke pakketten. We luisteren eerst naar wat jouw zaak nodig heeft, stellen een passend voorstel op en houden de samenwerking overzichtelijk van eerste gesprek tot publicatie.","aboutFitTitle":"Voor wie we werken","aboutFitText":"We richten ons op lokale zelfstandigen en kleine ondernemingen, zoals tandartspraktijken, vakmannen, installateurs en dienstverleners. De inhoud en structuur stemmen we af op de vragen die hun klanten echt hebben.","aboutHonestyTitle":"Transparant vanaf het begin","aboutHonestyText":"We tonen conceptwebsites om ideeën tastbaar te maken. Die voorbeelden zijn geen echte klantprojecten. Ook prijzen, inbegrepen werk, extra kosten en timing worden vooraf besproken en in het voorstel verduidelijkt.","aboutStepsTitle":"Zo werken we samen","aboutStep1":"Kennismaken: we bespreken je bedrijf, doelgroep, doelen en gewenste functies.","aboutStep2":"Voorstel: je ontvangt een duidelijke scope, richtprijs en planning.","aboutStep3":"Ontwerp en feedback: we bouwen de afgesproken website en verwerken feedback binnen de afgesproken rondes.","aboutStep4":"Oplevering: na goedkeuring zetten we de website klaar voor publicatie en overlopen we de praktische afspraken.","aboutCtaTitle":"Vertel ons wat jouw zaak nodig heeft.","aboutCtaText":"Een eerste gesprek is vrijblijvend. We bekijken samen of we een goede match zijn."},"fr":{"navHome":"← Retour à l'accueil","navAbout":"À propos","includedTitle":"Que comprend le prix ?","includedIntro":"Les formules donnent un point de départ clair. Le contenu exact est toujours confirmé dans un devis avant le début du projet.","starterDetail":"Design personnalisé sur une page, affichage mobile, coordonnées ou bouton de contact et référencement de base pour une page.","businessDetail":"Jusqu'à cinq pages, design personnalisé, formulaire de contact, affichage mobile et référencement de base pour les pages convenues.","premiumDetail":"Jusqu'à huit pages, design plus complet, fonctionnalités supplémentaires convenues et référencement de base avec optimisation complémentaire.","commonIncluded":"Pour chaque projet, nous définissons à l'avance la structure, le contenu, les étapes de validation et la livraison.","notIncluded":"Non inclus par défaut : nom de domaine, hébergement, extensions ou outils payants, photographie professionnelle, rédaction de textes ou abonnements externes. Si nécessaire, ces éléments sont indiqués séparément dans le devis.","paymentTitle":"Paiement et accords","paymentText":"Vous recevez d'abord une proposition précisant le contenu, le prix et le calendrier. Les échéances de paiement et tout acompte éventuel sont définis dans le devis avant le début. Nous commençons après votre accord.","changesTitle":"Modifications","changesText":"Les retours et le nombre de séries de corrections incluses sont convenus à l'avance. Les pages supplémentaires, nouvelles fonctions ou changements hors périmètre peuvent entraîner un supplément. Nous en discutons toujours avant.","deliveryTitle":"Livraison","deliveryText":"Après votre validation finale, le site est préparé pour sa publication. Le délai dépend de l'ampleur du projet et de la rapidité avec laquelle les textes, photos et retours sont fournis. Le domaine et l'hébergement ne sont organisés que s'ils figurent dans le devis.","portfolioDisclaimer":"Important : les sites présentés dans notre portfolio sont des concepts fictifs illustrant notre style et nos possibilités. Il ne s'agit pas de projets clients réalisés ni de recommandations de clients existants.","faqEyebrow":"QUESTIONS FRÉQUENTES","faqTitle":"Les réponses avant de commencer.","faq1q":"Dois-je payer immédiatement ?","faq1a":"Non. Vous recevez d'abord une proposition précisant le périmètre, le prix et le calendrier. Les acomptes et échéances éventuels sont convenus par écrit à l'avance.","faq2q":"Puis-je demander des modifications après le premier design ?","faq2a":"Oui. Nous convenons à l'avance des étapes de retour et du nombre de séries de corrections incluses. Les changements importants ou fonctions supplémentaires peuvent être facturés après discussion.","faq3q":"Combien de temps faut-il pour publier mon site ?","faq3a":"Cela dépend du nombre de pages, des fonctionnalités et de la rapidité avec laquelle nous recevons les textes, photos et retours. Le calendrier est indiqué dans le devis.","faq4q":"Le domaine et l'hébergement sont-ils inclus ?","faq4a":"Pas par défaut. Le domaine, l'hébergement, les outils payants et services externes sont indiqués séparément s'ils sont nécessaires.","faq5q":"Les sites du portfolio appartiennent-ils à de vrais clients ?","faq5a":"Non. Ce sont des concepts fictifs destinés à présenter différents styles et fonctionnalités, et non des références de clients réels.","faq6q":"De quoi ai-je besoin pour commencer ?","faq6a":"Présentez-nous votre activité, votre clientèle et les objectifs du site. Un logo, des textes et des photos sont utiles si vous les avez déjà.","aboutNavCta":"Parlons de votre projet ↗","aboutEyebrow":"À PROPOS DE FREELANCEFLOW","aboutTitle":"Un webdesign personnel. Des accords clairs.","aboutIntro":"FreelanceFlow aide les indépendants et petites entreprises à présenter leurs services de manière professionnelle en ligne. Nous créons des sites clairs qui inspirent confiance et encouragent les visiteurs à passer à l'action.","aboutMissionTitle":"Notre approche","aboutMissionText":"Pas de jargon compliqué ni d'offres floues. Nous commençons par écouter vos besoins, préparons une proposition adaptée et gardons la collaboration claire du premier échange à la mise en ligne.","aboutFitTitle":"Pour qui travaillons-nous ?","aboutFitText":"Nous nous adressons aux indépendants et petites entreprises locales, notamment les cabinets dentaires, artisans, installateurs et prestataires de services.","aboutHonestyTitle":"La transparence dès le départ","aboutHonestyText":"Nous présentons des sites conceptuels pour rendre les idées concrètes. Ces exemples ne sont pas de vrais projets clients. Les prix, prestations incluses, frais supplémentaires et délais sont discutés à l'avance.","aboutStepsTitle":"Comment nous collaborons","aboutStep1":"Premier échange : nous discutons de votre activité, clientèle, objectifs et fonctions souhaitées.","aboutStep2":"Proposition : vous recevez un périmètre clair, un prix indicatif et un calendrier.","aboutStep3":"Design et retours : nous réalisons le site convenu et intégrons les retours selon les étapes prévues.","aboutStep4":"Livraison : après validation, nous préparons le site pour sa publication et confirmons les détails pratiques.","aboutCtaTitle":"Parlons des besoins de votre entreprise.","aboutCtaText":"Le premier échange est sans engagement. Voyons ensemble si nous pouvons bien travailler ensemble."},"en":{"navHome":"← Back to home","navAbout":"About us","includedTitle":"What's included in the price?","includedIntro":"The packages provide a clear starting point. The exact scope is always confirmed in a quote before work begins.","starterDetail":"Custom one-page design, mobile-friendly layout, contact details or contact button, and basic SEO for one page.","businessDetail":"Up to five pages, custom design, contact form, mobile-friendly layout, and basic SEO for the agreed pages.","premiumDetail":"Up to eight pages, a more extensive design, agreed additional features, and basic SEO with further optimisation.","commonIncluded":"For every project, we agree on the structure, content, feedback stages, and delivery in advance.","notIncluded":"Not included by default: domain name, hosting, paid plugins or tools, professional photography, copywriting, or external subscriptions. If needed, these are listed separately in the quote.","paymentTitle":"Payments and agreements","paymentText":"You first receive a proposal outlining the scope, price, and timeline. Payment stages and any deposit are clearly stated in the quote before work starts. Work begins after you approve the proposal.","changesTitle":"Revisions","changesText":"Feedback stages and included revision rounds are agreed in advance. Extra pages, new features, or changes outside the agreed scope may cost extra. We always discuss this first.","deliveryTitle":"Delivery","deliveryText":"After your final approval, we prepare the website for publication. Timing depends on project size and how quickly text, photos, and feedback are provided. Domain and hosting are arranged only if included in the quote.","portfolioDisclaimer":"Important: the websites in our portfolio are fictional concept designs showing our style and capabilities. They are not completed client projects or testimonials from existing customers.","faqEyebrow":"FREQUENTLY ASKED QUESTIONS","faqTitle":"Good to know before we start.","faq1q":"Do I have to pay straight away?","faq1a":"No. You first receive a proposal with the scope, price, and timeline. Any deposit and payment stages are agreed in writing beforehand.","faq2q":"Can I request changes after the first design?","faq2a":"Yes. We agree on feedback stages and included revision rounds in advance. Major changes or extra features may cost more, but we discuss this first.","faq3q":"How long does it take to launch my website?","faq3a":"It depends on the number of pages, features, and how quickly we receive text, photos, and feedback. The proposal includes an estimated schedule.","faq4q":"Are domain and hosting included?","faq4a":"Not by default. Domain, hosting, paid tools, and external services are listed separately if needed.","faq5q":"Are the portfolio websites real client projects?","faq5a":"No. They are fictional concepts showing possible styles and features, not real client references.","faq6q":"What do I need to get started?","faq6a":"Tell us what your business does, who your customers are, and what the website should achieve. A logo, text, and photos are useful if available.","aboutNavCta":"Discuss your project ↗","aboutEyebrow":"ABOUT FREELANCEFLOW","aboutTitle":"Personal web design. Clear agreements.","aboutIntro":"FreelanceFlow helps self-employed professionals and small businesses present their services professionally online. We focus on clear websites that build trust and guide visitors towards taking action.","aboutMissionTitle":"Our approach","aboutMissionText":"No confusing jargon or unclear packages. We start by listening to what your business needs, prepare a suitable proposal, and keep the process clear from the first conversation to launch.","aboutFitTitle":"Who we work with","aboutFitText":"We focus on local independent professionals and small businesses, such as dental practices, tradespeople, installers, and service providers.","aboutHonestyTitle":"Transparency from the start","aboutHonestyText":"We show concept websites to make ideas tangible. These examples are not real client projects. Prices, included work, extra costs, and timing are discussed and clarified in the proposal.","aboutStepsTitle":"How we work together","aboutStep1":"Discovery: we discuss your business, audience, goals, and desired features.","aboutStep2":"Proposal: you receive a clear scope, indicative price, and timeline.","aboutStep3":"Design and feedback: we build the agreed website and incorporate feedback within the agreed rounds.","aboutStep4":"Delivery: after approval, we prepare the website for publication and confirm the practical details.","aboutCtaTitle":"Tell us what your business needs.","aboutCtaText":"The first conversation is free of obligation. Let's see whether we're a good fit."}};function setLanguage(lang){const t=translations[lang]||translations.nl;document.documentElement.lang=lang;document.getElementById('language').value=lang;document.querySelectorAll('[data-i]').forEach(el=>{const k=el.dataset.i;if(t[k]!==undefined)el.innerHTML=t[k]});document.title='FreelanceFlow | '+({nl:'Over ons',fr:'À propos',en:'About us'}[lang]);try{localStorage.setItem('ff-lang',lang)}catch(e){}}document.getElementById('language').addEventListener('change',e=>setLanguage(e.target.value));let initial='nl';try{const saved=localStorage.getItem('ff-lang');if(['nl','fr','en'].includes(saved))initial=saved}catch(e){}setLanguage(initial);</script>

(()=>{if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const targets=document.querySelectorAll('.section,.card,.portfolio-item,.detail-card,.step,.cta,.tool-panel,.free-form,.about-panel,.booking-grid');targets.forEach(el=>el.classList.add('reveal'));document.documentElement.classList.add('reveal-ready');if(!('IntersectionObserver'in window)){targets.forEach(el=>el.classList.add('is-visible'));return}const io=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('is-visible');io.unobserve(entry.target)}}),{threshold:.12,rootMargin:'0px 0px -35px 0px'});targets.forEach(el=>io.observe(el));})();
</script>

<script id="freelanceflow-motion-script">
(function(){
  var reduce=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce || !('IntersectionObserver' in window)) return;
  document.documentElement.classList.add('motion-ready');
  function init(){
    var selectors='main section, .section, .section-intro, .section-head, .card, .portfolio-item, .detail-card, .step, .industry-preview';
    var nodes=Array.prototype.slice.call(document.querySelectorAll(selectors));

      });
    },{threshold:.12,rootMargin:'0px 0px -48px 0px'});

})();

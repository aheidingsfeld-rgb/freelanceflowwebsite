<script id="freelanceflow-motion-script">
(function(){
  var reduce=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce || !('IntersectionObserver' in window)) return;
  document.documentElement.classList.add('motion-ready');
  function init(){
    var selectors='main section, .section, .section-intro, .section-head, .card, .portfolio-item, .detail-card, .step, .industry-preview';
    var nodes=Array.prototype.slice.call(document.querySelectorAll(selectors));
    nodes=nodes.filter(function(el){return !el.closest('header') && !el.closest('footer') && !el.classList.contains('hero') && !el.classList.contains('industry-hero');});
    nodes.forEach(function(el){el.classList.add('ff-reveal');});
    document.querySelectorAll('.grid, .cards, .portfolio-grid, .steps, .industry-grid').forEach(function(el){el.classList.add('ff-stagger');});
    var observer=new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){entry.target.classList.add('ff-visible');observer.unobserve(entry.target);}
      });
    },{threshold:.12,rootMargin:'0px 0px -48px 0px'});
    nodes.forEach(function(el){observer.observe(el);});
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init,{once:true}); else init();
})();
</script>

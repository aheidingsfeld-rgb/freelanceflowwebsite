name: Inspect packaged site source
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run build
      - name: Publish extracted source for editing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan extracted-site-source
          git rm -rf . || true
          mkdir -p extracted-site
          cp -R dist/. extracted-site/
          git add extracted-site
          git commit -m "Expose extracted site source for translation work"
          git push --force origin extracted-site-source
